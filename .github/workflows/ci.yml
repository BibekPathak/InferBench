name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test (CPU-only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest
        run: pytest -q

      # GPU tests are explicitly deselected: CI has no accelerator, and the
      # suite must pass without one.
      - name: Pytest (explicit, GPU excluded)
        run: pytest -q -m "not gpu"

  smoke:
    name: Doctor smoke test (no GPU expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: inferbench doctor must succeed without a GPU
        run: inferbench doctor
      - name: inferbench doctor --json must be valid JSON
        run: inferbench doctor --json | python -c "import json,sys; json.load(sys.stdin)"
