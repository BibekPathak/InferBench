[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferbench"
version = "0.1.0"
description = "Real-world LLM inference benchmarking and optimization platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "InferBench Contributors" }]
keywords = ["llm", "inference", "benchmark", "vllm", "latency", "throughput"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real inference backends. Kept optional so the core engine installs and
# tests cleanly on CPU-only hosts.
vllm = [
    "openai>=1.30",
]
# Analysis extras: chart rendering for reports.
analysis = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
inferbench = "inferbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/inferbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["B008"] # Typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["matplotlib.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "gpu: requires GPU hardware (deselected in CPU-only environments)",
    "slow: long-running tests",
    "integration: exercises a live backend server",
]

[tool.coverage.run]
source = ["src/inferbench"]
branch = true
